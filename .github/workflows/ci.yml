name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    # Self-hosted Mac mini — this repo is private and the org's
    # GitHub-hosted minute budget is exhausted (every ubuntu-latest job
    # dies in 2s with no step output). Per the 2026-04-22 carve-out:
    # private repos run on self-hosted; public repos use ubuntu-latest
    # (still free).
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Self-test runs the deny-list against synthetic deleted-symbol
      # probes BEFORE checking real content. This catches a regression
      # where a pattern's regex stops matching the symbol it's meant to
      # guard against — without it, the gate could silently rot to
      # always-pass even as new stale refs land.
      - name: docs accuracy gate (self-test)
        run: bash scripts/check-stale-refs.sh --self-test
      - name: docs accuracy gate
        run: bash scripts/check-stale-refs.sh
      # Broken-link gate — pairs with the stale-refs gate above. The
      # stale-refs check catches symbol references that should have
      # been deleted; this one catches link targets that moved or
      # never existed (the fumadocs build doesn't fail on broken
      # cross-links — they render as visible "broken text" once a
      # user clicks). Self-test runs first to verify the resolver
      # itself; real run follows.
      - name: docs broken-link gate (self-test)
        run: python3 scripts/check-broken-links.py --self-test
      - name: docs broken-link gate
        run: python3 scripts/check-broken-links.py
